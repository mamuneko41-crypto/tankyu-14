<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#edf5ec">
  <title>leaf | My Tasks</title>


  <style>
    :root {
      --bg: #edf5ec;
      --green: #668b68;
      --green-dark: #365b3b;
      --green-light: #dcebd9;
      --text: #344437;
      --muted: #879589;
      --white: #ffffff;
      --border: #e7eee5;
      --shadow: 0 10px 35px rgba(60, 90, 60, 0.07);
    }


    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top left, #dcebd9 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      -webkit-font-smoothing: antialiased;
    }


    button, input {
      font: inherit;
    }


    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }


    .app {
      width: min(100% - 32px, 720px);
      margin: 0 auto;
      padding: 30px 0 50px;
    }


    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 44px;
    }


    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 25px;
      font-weight: 750;
      letter-spacing: -1px;
      color: var(--green-dark);
    }


    .brand-icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      background: var(--white);
      border-radius: 15px;
      box-shadow: var(--shadow);
      font-size: 23px;
    }


    .date-pill {
      padding: 10px 14px;
      border: 1px solid rgba(102, 139, 104, 0.13);
      background: rgba(255, 255, 255, 0.7);
      border-radius: 30px;
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 650;
    }


    .greeting {
      margin-bottom: 25px;
    }


    .eyebrow {
      margin: 0 0 10px;
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }


    h1 {
      margin: 0;
      font-size: clamp(29px, 6vw, 42px);
      line-height: 1.35;
      letter-spacing: -1.5px;
      font-weight: 750;
    }


    h1 span {
      color: var(--green);
    }


    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }


    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 30px 0;
    }


    .stat-card {
      padding: 20px;
      background: rgba(255, 255, 255, 0.83);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }


    .stat-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }


    .stat-number {
      margin-top: 8px;
      color: var(--green-dark);
      font-size: 32px;
      font-weight: 750;
      letter-spacing: -1px;
    }


    .stat-number small {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
    }


    .panel {
      padding: 25px;
      background: rgba(255, 255, 255, 0.91);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 26px;
      box-shadow: var(--shadow);
    }


    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 23px;
    }


    h2 {
      margin: 0;
      font-size: 19px;
      letter-spacing: -0.5px;
    }


    .task-count {
      padding: 7px 11px;
      background: var(--green-light);
      color: var(--green-dark);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;
    }


    .add-form {
      display: flex;
      gap: 9px;
      margin-bottom: 23px;
    }


    .add-input {
      flex: 1;
      min-width: 0;
      padding: 14px 15px;
      background: #f7faf6;
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      color: var(--text);
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }


    .add-input:focus {
      border-color: #91b493;
      box-shadow: 0 0 0 3px rgba(102, 139, 104, 0.1);
    }


    .add-input::placeholder {
      color: #a8b3a8;
    }


    .add-button {
      padding: 0 19px;
      border: 0;
      border-radius: 14px;
      background: var(--green);
      color: white;
      font-size: 13px;
      font-weight: 750;
      transition: background 0.2s, transform 0.2s;
    }


    .add-button:hover {
      background: var(--green-dark);
    }


    .add-button:active {
      transform: scale(0.97);
    }


    .task-list {
      display: grid;
      gap: 10px;
    }


    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 12px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fff;
      animation: appear 0.22s ease;
      transition: background 0.2s, border-color 0.2s;
    }


    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    .check {
      appearance: none;
      -webkit-appearance: none;
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      margin: 0;
      border: 1.7px solid #cbd8c9;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: 0.2s;
    }


    .check:checked {
      border-color: var(--green);
      background: var(--green);
    }


    .check:checked::after {
      content: "✓";
      color: white;
      font-size: 14px;
      font-weight: 800;
    }


    .task-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.6;
    }


    .task.done .task-text {
      color: #a2ada1;
      text-decoration: line-through;
    }


    .task.done {
      background: #f9fbf8;
    }


    .task-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }


    .icon-button {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #91a091;
      font-size: 16px;
      transition: background 0.2s, color 0.2s;
    }


    .icon-button:hover {
      background: #edf5ec;
      color: var(--green-dark);
    }


    .empty {
      padding: 32px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 2;
    }


    .empty-icon {
      display: block;
      margin-bottom: 9px;
      font-size: 31px;
    }


    .progress-section {
      margin-top: 27px;
      padding: 20px;
      background: #f4f8f2;
      border-radius: 18px;
    }


    .progress-heading {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 700;
    }


    .progress-percent {
      color: var(--green);
    }


    .progress-track {
      height: 8px;
      overflow: hidden;
      border-radius: 20px;
      background: #e1eade;
    }


    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, #a9cda5, #668b68);
      transition: width 0.35s ease;
    }


    .footer {
      padding: 27px 10px 0;
      text-align: center;
      color: #9baa99;
      font-size: 11px;
      letter-spacing: 0.5px;
    }


    .toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      z-index: 10;
      width: max-content;
      max-width: calc(100% - 32px);
      padding: 12px 18px;
      transform: translate(-50%, 15px);
      opacity: 0;
      pointer-events: none;
      border-radius: 14px;
      background: #365b3b;
      color: white;
      font-size: 13px;
      box-shadow: var(--shadow);
      transition: opacity 0.2s, transform 0.2s;
    }


    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }


    @media (max-width: 480px) {
      .app {
        width: min(100% - 22px, 720px);
        padding-top: 20px;
      }


      header {
        margin-bottom: 35px;
      }


      .brand {
        font-size: 22px;
      }


      .brand-icon {
        width: 38px;
        height: 38px;
        border-radius: 13px;
      }


      .date-pill {
        padding: 9px 10px;
        font-size: 10px;
      }


      .stats {
        gap: 10px;
        margin: 24px 0;
      }


      .stat-card {
        padding: 17px;
        border-radius: 19px;
      }


      .stat-number {
        font-size: 29px;
      }


      .panel {
        padding: 18px 14px;
        border-radius: 22px;
      }


      .add-form {
        gap: 7px;
      }


      .add-input {
        padding: 13px 11px;
        font-size: 13px;
      }


      .add-button {
        padding: 0 13px;
        font-size: 12px;
      }


      .task {
        gap: 9px;
        padding: 12px 8px;
      }


      .task-text {
        font-size: 13px;
      }


      .task-actions {
        gap: 0;
      }


      .icon-button {
        width: 30px;
        height: 32px;
      }
    }


    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>


<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="brand-icon">🌿</div>
        <span>leaf</span>
      </div>
      <div class="date-pill" id="date"></div>
    </header>


    <section class="greeting">
      <p class="eyebrow">A LITTLE PROGRESS EVERY DAY</p>
      <h1>今日も、<br><span>自分のペースで。</span></h1>
      <p class="subtitle">
        やることをひとつずつ。<br>
        小さな一歩も、ちゃんと前進。
      </p>
    </section>


    <section class="stats" aria-label="タスクの統計">
      <div class="stat-card">
        <div class="stat-label">残りのタスク</div>
        <div class="stat-number" id="remaining">0 <small>tasks</small></div>
      </div>


      <div class="stat-card">
        <div class="stat-label">完了したタスク</div>
        <div class="stat-number" id="completed">0 <small>tasks</small></div>
      </div>
    </section>


    <section class="panel">
      <div class="panel-heading">
        <h2>My tasks</h2>
        <span class="task-count" id="taskCount">0 TASKS</span>
      </div>


      <form class="add-form" id="addForm">
        <input
          class="add-input"
          id="taskInput"
          type="text"
          maxlength="200"
          placeholder="新しいタスクを入力..."
          autocomplete="off"
          aria-label="新しいタスク"
        >
        <button class="add-button" type="submit">＋ 追加</button>
      </form>


      <div class="task-list" id="taskList"></div>


      <div class="progress-section">
        <div class="progress-heading">
          <span>今日の進捗</span>
          <span class="progress-percent" id="progressText">0%</span>
        </div>
        <div
          class="progress-track"
          id="progressTrack"
          role="progressbar"
          aria-label="タスクの完了率"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </section>


    <footer class="footer">
      MADE WITH CARE · LEAF 🌱
    </footer>
  </main>


  <div class="toast" id="toast" role="status" aria-live="polite"></div>


  <script>
    const STORAGE_KEY = "leaf-todo-tasks-v1";


    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    const addForm = document.getElementById("addForm");
    const toast = document.getElementById("toast");


    let tasks = loadTasks();
    let toastTimer;


    function loadTasks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        const parsed = saved ? JSON.parse(saved) : [];


        if (!Array.isArray(parsed)) return [];


        return parsed.filter(task =>
          task &&
          typeof task.id === "string" &&
          typeof task.text === "string" &&
          typeof task.done === "boolean"
        );
      } catch (error) {
        return [];
      }
    }


    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        return true;
      } catch (error) {
        showToast("保存できませんでした。ブラウザの設定を確認してね。");
        return false;
      }
    }


    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");


      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }


    function updateDate() {
      const now = new Date();


      document.getElementById("date").textContent =
        new Intl.DateTimeFormat("ja-JP", {
          year: "numeric",
          month: "long",
          day: "numeric",
          weekday: "short"
        }).format(now);
    }


    function createId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }


      return Date.now().toString(36) +
        Math.random().toString(36).slice(2);
    }


    function addTask(text) {
      const trimmed = text.trim();


      if (!trimmed) {
        showToast("タスクを入力してね 🌱");
        taskInput.focus();
        return;
      }


      tasks.unshift({
        id: createId(),
        text: trimmed,
        done: false
      });


      saveTasks();
      render();
      taskInput.value = "";
      taskInput.focus();
      showToast("タスクを追加したよ 🌿");
    }


    function toggleTask(id) {
      const task = tasks.find(item => item.id === id);
      if (!task) return;


      task.done = !task.done;
      saveTasks();
      render();


      if (task.done) {
        showToast("おつかれさま！ひとつ完了 ✨");
      }
    }


    function editTask(id) {
      const task = tasks.find(item => item.id === id);
      if (!task) return;


      const result = window.prompt("タスクの内容を編集", task.text);


      if (result === null) return;


      const trimmed = result.trim();


      if (!trimmed) {
        showToast("内容が空なので変更しなかったよ");
        return;
      }


      task.text = trimmed.slice(0, 200);
      saveTasks();
      render();
      showToast("タスクを更新したよ 🌱");
    }


    function deleteTask(id) {
      const task = tasks.find(item => item.id === id);
      if (!task) return;


      if (!window.confirm("「" + task.text + "」を削除する？")) {
        return;
      }


      tasks = tasks.filter(item => item.id !== id);
      saveTasks();
      render();
      showToast("タスクを削除したよ");
    }


    function render() {
      taskList.replaceChildren();


      const total = tasks.length;
      const completed = tasks.filter(task => task.done).length;
      const remaining = total - completed;
      const progress = total === 0
        ? 0
        : Math.round(completed / total * 100);


      document.getElementById("remaining").innerHTML =
        ${remaining} <small>tasks</small>;


      document.getElementById("completed").innerHTML =
        ${completed} <small>tasks</small>;


      document.getElementById("taskCount").textContent =
        ${total} ${total === 1 ? "TASK" : "TASKS"};


      document.getElementById("progressText").textContent =
        ${progress}%;


      document.getElementById("progressFill").style.width =
        ${progress}%;


      document.getElementById("progressTrack").setAttribute(
        "aria-valuenow",
        String(progress)
      );


      if (total === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";


        const icon = document.createElement("span");
        icon.className = "empty-icon";
        icon.textContent = "🍃";


        const message = document.createElement("span");
        message.textContent = "まだタスクがないよ。";


        const br = document.createElement("br");
        const hint = document.createElement("span");
        hint.textContent = "最初のひとつを追加してみよう！";


        empty.append(icon, message, br, hint);
        taskList.appendChild(empty);
        return;
      }


      tasks.forEach(task => {
        const row = document.createElement("div");
        row.className = "task" + (task.done ? " done" : "");


        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "check";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", task.text + "を完了");
        checkbox.addEventListener("change", () => toggleTask(task.id));


        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;


        const actions = document.createElement("div");
        actions.className = "task-actions";


        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.className = "icon-button";
        editButton.textContent = "✎";
        editButton.setAttribute("aria-label", task.text + "を編集");
        editButton.title = "編集";
        editButton.addEventListener("click", () => editTask(task.id));


        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "icon-button";
        deleteButton.textContent = "×";
        deleteButton.setAttribute("aria-label", task.text + "を削除");
        deleteButton.title = "削除";
        deleteButton.addEventListener("click", () => deleteTask(task.id));


        actions.append(editButton, deleteButton);
        row.append(checkbox, text, actions);
        taskList.appendChild(row);
      });
    }


    addForm.addEventListener("submit", event => {
      event.preventDefault();
      addTask(taskInput.value);
    });


    updateDate();
    render();
  </script>
</body>
</html>
